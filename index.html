<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Label Solutions Pet Shop Chatbot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for pet-friendly typography -->
    <link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your_Telescope&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Custom CSS for pet-themed styling and animations */
        body {
            background: url('https://source.unsplash.com/random/1600x900/?dogs,cats,pets') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', cursive;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 247, 237, 0.9);
            z-index: -1;
        }
        /* Background overlay with pet elements */
        .pet-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/paws.png') repeat;
            opacity: 0.2;
            z-index: -1;
        }
        .pet-toy {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
        }
        .chat-container {
            animation: fadeIn 1s ease-in-out;
            background: #fff7ed;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 4px solid #facc15;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            margin: 1rem;
            position: relative;
            overflow: hidden;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .chat-header {
            background: linear-gradient(to right, #facc15, #f97316);
            color: white;
            padding: 1rem;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .chat-header::before {
            content: '🐾';
            position: absolute;
            left: 1rem;
            font-size: 1.5rem;
            animation: bounce 2s infinite;
        }
        .chat-header::after {
            content: '🐾';
            position: absolute;
            right: 1rem;
            font-size: 1.5rem;
            animation: bounce 2s infinite 0.5s;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 1.5rem;
            background: #fefce8;
            border-bottom: 1px solid #facc15;
            display: flex;
            flex-direction: column;
        }
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #facc15;
            border-radius: 3px;
        }
        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 15px;
            max-width: 70%;
            position: relative;
            animation: slideIn 0.5s ease-out;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .bot-message {
            background: #c6f0d4;
            color: #2d6a4f;
            border-bottom-left-radius: 0;
            align-self: flex-start;
        }
        .bot-message::before {
            content: '🐶';
            position: absolute;
            left: -30px;
            top: 10px;
            font-size: 1.2rem;
        }
        .user-message {
            background: #fdd835;
            color: #92400e;
            margin-left: auto;
            border-bottom-right-radius: 0;
            align-self: flex-end;
        }
        .user-message::after {
            content: '🐱';
            position: absolute;
            right: -30px;
            top: 10px;
            font-size: 1.2rem;
        }
        .chat-input {
            padding: 1rem;
            background: #fff7ed;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            position: relative;
        }
        #user-input {
            background: #fefce8;
            border: 2px solid #facc15;
            border-radius: 20px 0 0 20px;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        #user-input:focus {
            border-color: #f97316;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.3);
        }
        .send-button {
            background: linear-gradient(to right, #facc15, #f97316);
            border-radius: 0 20px 20px 0;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .send-button:hover {
            background: linear-gradient(to right, #f97316, #facc15);
            transform: scale(1.05);
        }
        .send-button::before {
            content: '🐾';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            font-size: 1.2rem;
            transition: opacity 0.3s ease;
        }
        .send-button:hover::before {
            opacity: 1;
        }
        .send-button:hover i {
            opacity: 0;
        }
        .typing-indicator {
            color: #f97316;
            font-style: italic;
        }
        .typing-indicator::after {
            content: '🐾🐾🐾';
            display: inline-block;
            margin-left: 0.5rem;
            animation: typingPaws 1.5s infinite;
        }
        @keyframes typingPaws {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .start-button {
            background: linear-gradient(to right, #facc15, #f97316);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-weight: bold;
            margin: 1rem auto;
            display: block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        .start-button:active {
            transform: translateY(0);
        }
        a {
            color: #f97316;
            text-decoration: underline;
        }
        .connecting {
            font-style: italic;
            color: #6b7280;
        }
        /* Pet companion */
        .pet-companion {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 2rem;
            transition: all 0.3s ease;
        }
        .pet-companion.active {
            animation: wagTail 1.5s infinite;
        }
        .pet-companion.idle {
            animation: sleep 3s infinite;
        }
        @keyframes wagTail {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }
        @keyframes sleep {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Background overlay with pet elements -->
    <div class="pet-overlay" id="pet-overlay"></div>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h1 class="text-xl font-bold">White Label Solutions Pet Shop Chatbot</h1>
        </div>
        <!-- Messages -->
        <div class="chat-messages" id="chat-messages">
            <!-- Initial message removed - will appear after clicking start button -->
        </div>
        <!-- Start Conversation Button -->
        <button id="start-button" class="start-button">
            Start Conversation <i class="fas fa-paw ml-2"></i>
        </button>
        <!-- Input Form (initially hidden) -->
        <div class="chat-input" id="chat-input" style="display: none;">
            <form id="chat-form" class="flex">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask about pet products..."
                    class="flex-1 p-2 focus:outline-none"
                    autocomplete="off"
                    required
                >
                <button
                    type="submit"
                    class="send-button text-white"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
            <!-- Pet companion -->
            <div class="pet-companion" id="pet-companion"></div>
        </div>
    </div>

    <!-- Sound effects -->
    <audio id="bot-sound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" type="audio/mpeg">
    </audio>
    <audio id="send-sound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Get DOM elements
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatMessages = document.getElementById('chat-messages');
        const startButton = document.getElementById('start-button');
        const chatInput = document.getElementById('chat-input');
        const botSound = document.getElementById('bot-sound');
        const sendSound = document.getElementById('send-sound');
        const petCompanion = document.getElementById('pet-companion');
        const petOverlay = document.getElementById('pet-overlay');
        let conversationHistory = [];
        let idleTimer;

        // Add pet toys to the background
        const petToys = ['🧸', '🎾', '🪀', '🐟', '🧀'];
        function addPetToys() {
            for (let i = 0; i < 8; i++) {
                const toy = document.createElement('div');
                toy.className = 'pet-toy';
                toy.textContent = petToys[Math.floor(Math.random() * petToys.length)];
                toy.style.top = `${Math.random() * 80 + 10}%`;
                toy.style.left = `${Math.random() * 80 + 10}%`;
                petOverlay.appendChild(toy);
            }
        }
        addPetToys();

        // Manage pet companion states
        function setPetState(state) {
            petCompanion.classList.remove('active', 'idle');
            petCompanion.classList.add(state);
            if (state === 'idle') {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => setPetState('idle'), 5000);
            }
        }
        setPetState('idle');

        // Add message to chat
        function addMessage(content, isBot = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isBot ? 'bot-message' : 'user-message'}`;
            
            // Process links in the message
            const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;
            const processedContent = content.replace(linkRegex, '<a href="$2" target="_blank">$1</a>');
            messageDiv.innerHTML = processedContent;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // Play sound for bot messages
            if (isBot) {
                botSound.currentTime = 0;
                botSound.play();
            }
        }

        // Add typing indicator
        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message typing-indicator';
            typingDiv.textContent = 'Typing...';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return typingDiv;
        }

        // Remove typing indicator
        function removeTypingIndicator(typingDiv) {
            if (typingDiv) typingDiv.remove();
        }

        // Handle form submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Disable form during submission
            chatForm.querySelector('button').disabled = true;
            addMessage(message, false);
            userInput.value = '';

            // Play send sound and animate pet
            sendSound.currentTime = 0;
            sendSound.play();
            setPetState('active');

            const typingDiv = addTypingIndicator();
            // Simulate human typing delay (1-3 seconds)
            await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 2000));
            try {
                console.log("Sending history:", conversationHistory);
                const response = await fetch('http://localhost:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        history: conversationHistory
                    })
                });
                const data = await response.json();
                removeTypingIndicator(typingDiv);
                addMessage(data.response, true);
                conversationHistory = data.history;
                console.log("Updated history:", conversationHistory);
            } catch (error) {
                removeTypingIndicator(typingDiv);
                addMessage('Sorry, something went wrong. Please try again!', true);
            } finally {
                chatForm.querySelector('button').disabled = false;
                setPetState('idle');
            }
        });

        // Enable Enter key submission
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Start conversation button
        startButton.addEventListener('click', async () => {
            startButton.style.display = 'none';
            
            // Show connecting message
            const connectingDiv = addTypingIndicator();
            connectingDiv.textContent = 'Connecting you with our executive...';
            
            // Simulate connection delay (2-3 seconds)
            await new Promise(resolve => setTimeout(resolve, 2000 + Math.random() * 1000));
            
            // Remove connecting message
            removeTypingIndicator(connectingDiv);
            
            // Show chat input
            chatInput.style.display = 'block';
            
            // Fetch initial message with agent name from backend
            try {
                const typingDiv = addTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 2000));
                const response = await fetch('http://localhost:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "start",
                        history: conversationHistory
                    })
                });
                const data = await response.json();
                const agentName = data.agent;
                removeTypingIndicator(typingDiv);
                addMessage(`Hello! I'm ${agentName}, your Chewy Pet Shop assistant! 🐾 How can I help you today?`, true);
                conversationHistory = data.history;
                setPetState('idle');
            } catch (error) {
                removeTypingIndicator(typingDiv);
                addMessage('Sorry, I couldn’t connect! Please try again later. 🐾', true);
            }
        });
    </script>
</body>
</html>
